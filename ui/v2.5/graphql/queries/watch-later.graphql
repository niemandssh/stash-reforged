query FindWatchLater($filter: FindFilterType) {
  findWatchLater(filter: $filter) {
    count
    items {
      addedAt
      scene {
        id
        title
        play_count
        resume_time
        force_hls
        is_broken
        is_probably_broken
        is_not_broken
        watch_later
        watch_later_at
        video_filters {
          contrast
          brightness
          gamma
          saturate
          hue_rotate
          white_balance
          red
          green
          blue
          blur
        }
        video_transforms {
          rotate
          scale
          aspect_ratio
        }
        files {
          path
          duration
        }
        paths {
          screenshot
          preview
          vtt
        }
        performers {
          id
          name
          gender
        }
        studio {
          id
          name
          image_path
        }
      }
    }
  }
}
